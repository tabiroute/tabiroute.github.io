function memoryAllowed(pg){return pg.hasOvernight===true?[0,1,2,3,4,5]:[0,2,3,4,5];}
function syncDayMetadata(payload){const maxDay=Math.max(1,...data.schedule.map(p=>+(p.title.match(/(\d+)日目/)||[])[1]||1));data.schedule.forEach(pg=>{const di=Number.isInteger(pg.dayIndex)?pg.dayIndex:Math.max(0,(+(pg.title.match(/(\d+)日目/)||[])[1]||1)-1),d=payload?.days?.[di];pg.dayIndex=di;pg.isLastDay=d?di===payload.days.length-1:(pg.isLastDay??di===maxDay-1);pg.hasOvernight=d?!!d.hasOvernight:(pg.hasOvernight??!pg.isLastDay);});}
function fillMemorySlots(){syncDayMetadata();data.schedule.forEach((pg,j)=>pg.stops.forEach((st,i)=>{if(st.memory&&st.memoryIndex===1&&!pg.hasOvernight&&st.place===MEMORY_PROMPTS[1][0]){st.memoryIndex=5;st.place=MEMORY_PROMPTS[5][0];if(st.note===MEMORY_PROMPTS[1][1])st.note=MEMORY_PROMPTS[5][1];}if(st.memory||st.place||st.time||st.note||st.caption||data.photos['s'+j+'-'+i])return;const allowed=memoryAllowed(pg),k=i===0?0:i===3?(pg.hasOvernight?1:5):allowed[(j+i)%allowed.length];Object.assign(st,{memory:true,memoryIndex:k,place:MEMORY_PROMPTS[k][0],note:MEMORY_PROMPTS[k][1],transport:'思い出'});}));}

function photo(id,captionPath,caption,cover=false){const p=Object.hasOwn(data.photos,id)?data.photos[id]:(cover?{src:ART,x:50,y:10}:null);const n=id==='cover'?'01':String(+(id.match(/\d+$/)?.[0]||0)+1).padStart(2,'0');return `<div class="photo"><button type="button" class="photo-hit" data-photo="${id}" aria-label="${cover?'表紙':id}の写真を選択">${p?`<img src="${p.src}" alt="${esc(caption||'旅の写真')}" style="object-position:${p.x}% ${p.y}%">`:''}<span class="empty"><b>${n}</b><span>YOUR PHOTO HERE</span></span></button>${field(captionPath,caption,'写真にひとこと','caption',24,1)}</div>`}

function render(){
fillMemorySlots();
document.body.classList.toggle('classic',data.design!=='editorial');$('designToggle').textContent=data.design==='editorial'?'旅のジャーナルに切替':'ポストカード風に切替';
let h=`<section class="page cover">${decoration('bottom','scenery')}<span class="classic-motto">Good Travel<br>Good Days!</span>${decoration('top','classic-mark')}<span class="classic-label">TRAVEL JOURNAL</span><div class="edition"><span>TABIROUTE / TRAVEL JOURNAL</span><span>NO. ${EDITION}</span></div><div class="roman">${data.design==='editorial'?ROMAN.charAt(0)+ROMAN.slice(1).toLowerCase()+'.':ROMAN}</div><div class="cover-photo">${photo('cover','coverCaption',data.coverCaption,true)}</div><span class="vertical">A LITTLE ESCAPE, A LOVELY MEMORY.</span><div class="stamp"><small>JAPAN / ${ROMAN}</small><b>${EDITION}</b><small>TRAVEL NOTES</small></div>${field('title',data.title,'旅のタイトル','cover-title',16,1)}${field('date',data.date,'YYYY.MM.DD — MM.DD','date',30,1)}${field('message',data.message,'心に残したい、旅のひとこと。','cover-message',35,2)}<span class="sign">Bon voyage!</span>${controls(0)}</section>`;

function cropGeometry(){
 if(!cropImage)return null;const w=$('cropStage').clientWidth,h=$('cropStage').clientHeight;
 const rotated=crop.angle%180!==0,iw=rotated?cropImage.height:cropImage.width,ih=rotated?cropImage.width:cropImage.height;
 const scale=Math.max(w/iw,h/ih)*crop.zoom,sw=iw*scale,sh=ih*scale;
 crop.x=Math.max(-(sw-w)/2/w,Math.min((sw-w)/2/w,crop.x));crop.y=Math.max(-(sh-h)/2/h,Math.min((sh-h)/2/h,crop.y));
 return {w,h,scale};
}
function drawCrop(){
 const g=cropGeometry(),c=$('cropPreview');if(!g)return;
 c.width=Math.round(g.w*2);c.height=Math.round(g.h*2);const ctx=c.getContext('2d');ctx.scale(2,2);ctx.fillStyle='#fff';ctx.fillRect(0,0,g.w,g.h);
 ctx.translate(g.w/2+crop.x*g.w,g.h/2+crop.y*g.h);ctx.rotate(crop.angle*Math.PI/180);ctx.scale(g.scale,g.scale);ctx.drawImage(cropImage,-cropImage.width/2,-cropImage.height/2);
 $('cropZoom').value=crop.zoom;$('zoomValue').textContent=crop.zoom.toFixed(1)+'×';
}
async function loadCrop(src,state){
 const epoch=++photoEpoch;cropBusy=true;$('photoDone').disabled=true;$('cropHint').textContent='写真を読み込み中…';
 try{const im=new Image();im.src=src;await im.decode();if(epoch!==photoEpoch)return;cropImage=im;crop={zoom:1,x:0,y:0,angle:0,...state};
 if(state&&Object.hasOwn(state,'legacyX')){const w=$('cropStage').clientWidth,h=$('cropStage').clientHeight,scale=Math.max(w/im.width,h/im.height);crop.x=(.5-(state.legacyX??50)/100)*(im.width*scale-w)/w;crop.y=(.5-(state.legacyY??50)/100)*(im.height*scale-h)/h;delete crop.legacyX;delete crop.legacyY}
 $('cropStage').classList.add('has-photo');$('cropHint').textContent='指で移動・2本指で拡大縮小';drawCrop();
 }catch(e){if(epoch===photoEpoch){cropImage=null;$('cropHint').textContent='写真を読み込めません。別の写真を選んでください。'}}finally{if(epoch===photoEpoch){cropBusy=false;$('photoDone').disabled=!cropImage}}
}
function openPhoto(b){
 activePhoto=b.dataset.photo;photoEpoch++;cropImage=null;cropBusy=false;pointers.clear();gesture=null;
 const p=Object.hasOwn(data.photos,activePhoto)?data.photos[activePhoto]:(activePhoto==='cover'?{src:ART,x:50,y:10}:null);
 draftPhoto=p?{...p}:null;cropRatio=b.clientWidth/b.clientHeight;
 const stage=$('cropStage');stage.style.aspectRatio=String(cropRatio);stage.style.width='min(100%, '+Math.round(250*cropRatio)+'px)';stage.classList.remove('has-photo');$('cropHint').textContent='下のボタンから写真を選んでください';$('file').value='';$('photoDone').disabled=true;
 $('photoDialog').showModal();positionPhotoDialog();if(parent!==window)parent.postMessage({type:'tabiroute:journal:photo-open'},location.origin);
 if(p)loadCrop(p.original||p.src,p.crop||{legacyX:p.x,legacyY:p.y});
}
$('file').onchange=async()=>{
 const f=$('file').files[0];if(!f)return;
 if(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>20*1024*1024){$('cropHint').textContent='20MB以下のJPEG・PNG・WebPを選んでください。';return}
 const epoch=++photoEpoch;cropBusy=true;$('photoDone').disabled=true;const url=URL.createObjectURL(f);
 try{const im=new Image();im.src=url;await im.decode();if(epoch!==photoEpoch)return;
 const ratio=Math.min(1,2400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*ratio);c.height=Math.round(im.height*ratio);const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(im,0,0,c.width,c.height);
 draftPhoto={src:c.toDataURL('image/jpeg',.91),x:50,y:50};await loadCrop(draftPhoto.src);
 }catch(e){if(epoch===photoEpoch){cropBusy=false;$('photoDone').disabled=!cropImage;$('cropHint').textContent='写真を読み込めません。別の写真を選んでください。'}}finally{URL.revokeObjectURL(url)}
};
function zoomCrop(z,cx=0,cy=0){const old=crop.zoom;crop.zoom=Math.min(5,Math.max(1,z));const ratio=crop.zoom/old;crop.x=cx-(cx-crop.x)*ratio;crop.y=cy-(cy-crop.y)*ratio;drawCrop()}
$('cropZoom').oninput=e=>zoomCrop(+e.target.value);
$('cropRotate').onclick=()=>{crop.angle=(crop.angle+90)%360;crop.zoom=1;crop.x=crop.y=0;drawCrop()};
$('cropReset').onclick=()=>{crop={zoom:1,x:0,y:0,angle:0};drawCrop()};
function startGesture(){const pts=[...pointers.values()];gesture={crop:{...crop},pts};}
const stage=$('cropStage');stage.onpointerdown=e=>{if(!cropImage)return;e.preventDefault();stage.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});startGesture()};
stage.onpointermove=e=>{
 if(!pointers.has(e.pointerId)||!gesture)return;e.preventDefault();pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});const pts=[...pointers.values()],g=gesture,rect=stage.getBoundingClientRect();
 if(pts.length===1){crop.x=g.crop.x+(pts[0].x-g.pts[0].x)/rect.width;crop.y=g.crop.y+(pts[0].y-g.pts[0].y)/rect.height}
 else{const a=g.pts,b=pts,dist=p=>Math.hypot(p[1].x-p[0].x,p[1].y-p[0].y);const oldCX=((a[0].x+a[1].x)/2-rect.left)/rect.width-.5,oldCY=((a[0].y+a[1].y)/2-rect.top)/rect.height-.5;
 crop.zoom=Math.max(1,Math.min(5,g.crop.zoom*dist(b)/Math.max(1,dist(a))));const ratio=crop.zoom/g.crop.zoom;
 crop.x=((b[0].x+b[1].x)/2-rect.left)/rect.width-.5-(oldCX-g.crop.x)*ratio;crop.y=((b[0].y+b[1].y)/2-rect.top)/rect.height-.5-(oldCY-g.crop.y)*ratio;
 }drawCrop();
};
function endPointer(e){pointers.delete(e.pointerId);startGesture()};stage.onpointerup=endPointer;stage.onpointercancel=endPointer;stage.onlostpointercapture=endPointer;
stage.onwheel=e=>{if(!cropImage)return;e.preventDefault();const r=stage.getBoundingClientRect();zoomCrop(crop.zoom*Math.exp(-e.deltaY*.002),(e.clientX-r.left)/r.width-.5,(e.clientY-r.top)/r.height-.5)};
stage.onkeydown=e=>{if(!cropImage)return;const moves={ArrowLeft:[-.025,0],ArrowRight:[.025,0],ArrowUp:[0,-.025],ArrowDown:[0,.025]};if(moves[e.key]){e.preventDefault();crop.x+=moves[e.key][0];crop.y+=moves[e.key][1];drawCrop()}};
$('photoDone').onclick=()=>{
 if(!cropImage||cropBusy)return;const g=cropGeometry(),c=document.createElement('canvas');c.width=Math.round(1600*Math.min(1,cropRatio));c.height=Math.round(c.width/cropRatio);const ctx=c.getContext('2d'),k=c.width/g.w;
 ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.translate(c.width/2+crop.x*c.width,c.height/2+crop.y*c.height);ctx.rotate(crop.angle*Math.PI/180);ctx.scale(g.scale*k,g.scale*k);ctx.drawImage(cropImage,-cropImage.width/2,-cropImage.height/2);
 data.photos[activePhoto]={src:c.toDataURL('image/jpeg',.92),original:draftPhoto.original||draftPhoto.src,crop:{...crop},x:50,y:50};render();changed();$('photoDialog').close();
};
$('photoDelete').onclick=()=>{data.photos[activePhoto]=null;render();changed();$('photoDialog').close()};$('photoCancel').onclick=()=>$('photoDialog').close();
$('photoDialog').addEventListener('close',()=>{photoEpoch++;pointers.clear();cropImage=null;if(parent!==window)parent.postMessage({type:'tabiroute:journal:photo-close'},location.origin)});

$('refreshPlan').hidden=parent===window;$('refreshPlan').onclick=()=>{if(confirm('最新の予定表を反映します。旅程ページの手編集と写真は置き換わります。表紙・思い出ページは残ります。続けますか？'))parent.postMessage({type:'tabiroute:journal:request-plan'},location.origin)};
$('designToggle').onclick=()=>{data.design=data.design==='editorial'?'watercolor':'editorial';render();changed()};
$('viewSize').onclick=()=>{document.body.classList.toggle('large');$('viewSize').textContent=document.body.classList.contains('large')?'一覧に戻る':'大きく編集';requestAnimationFrame(fitFields)};
$('add').onclick=()=>{if(data.schedule.length>=30){status('旅程は最大30ページです。');return}data.schedule.push({title:'旅のスケジュール',subtitle:'',stops:Array.from({length:4},blankStop)});render();changed()};$('print').onclick=exportPDF;

async function inlineJournalAssets(copy){
  const asData=async(url)=>{const res=await fetch(url);if(!res.ok)throw Error('Asset '+res.status);const blob=await res.blob();return await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(reader.error);reader.readAsDataURL(blob)})};
  for(const link of copy.querySelectorAll('link[data-embed]')){
    const url=new URL(link.getAttribute('href'),document.baseURI),res=await fetch(url);if(!res.ok)throw Error('Font CSS');let css=await res.text();
    const matches=[...css.matchAll(/url\(([^)]+)\)/g)];
    for(const match of matches){const ref=match[1].replace(/["']/g,'');if(!ref.startsWith('data:'))css=css.replace(match[0],'url('+await asData(new URL(ref,url))+')')}
    const style=document.createElement('style');style.textContent=css;link.replaceWith(style);
  }
  for(const script of copy.querySelectorAll('script[data-embed][src]')){
    const res=await fetch(new URL(script.getAttribute('src'),document.baseURI));if(!res.ok)throw Error('Export script');script.textContent=await res.text();script.removeAttribute('src');script.removeAttribute('data-embed');
  }
  if(!SCENERY.startsWith('data:')){
    const scenery=await asData(new URL(SCENERY,document.baseURI));
    for(const script of copy.querySelectorAll('script:not([src])'))script.textContent=script.textContent.replace('const SCENERY='+JSON.stringify(SCENERY),'const SCENERY='+JSON.stringify(scenery));
  }
}

$('backup').onclick=async()=>{$('backup').disabled=true;status('編集できるHTMLを作成しています…');try{const copy=document.documentElement.cloneNode(true);copy.querySelector('#travelSaveDialog')?.remove();copy.querySelector('#backup').disabled=false;copy.querySelector('#seed').textContent=JSON.stringify(data).replace(/</g,'\\u003c');copy.querySelector('#pages').innerHTML='';copy.querySelector('#status').textContent='';copy.querySelector('#photoDialog').removeAttribute('open');copy.querySelector('#cropPreview').removeAttribute('src');await inlineJournalAssets(copy);const blob=new Blob(['<!doctype html>\n'+copy.outerHTML],{type:'text/html;charset=utf-8'});downloadBlob(blob,SLUG+'-travel-journal.html');status('HTMLの準備ができました。保存方法を選んでください。')}catch(e){status('HTML保存に必要な素材を取得できませんでした。オンラインで再度お試しください。');console.error(e)}finally{$('backup').disabled=false}};
$('reset').onclick=()=>{if(!confirm('現在のしおりを初期化しますか？ 必要なら先にHTMLを保存してください。'))return;data=defaults();render();changed()};
let exportBusy=false;
async function capturePage(pg,width=1440){
 await document.fonts.ready;await Promise.all([...pg.querySelectorAll('img')].map(im=>im.decode().catch(()=>{})));
 const bounds=pg.getBoundingClientRect();
 const canvas=await html2canvas(pg,{scale:width/bounds.width,backgroundColor:null,logging:false,onclone:doc=>{
 doc.body.classList.add('exporting');doc.querySelectorAll('.page-controls,.photo-hit .empty').forEach(el=>el.style.display='none');
 doc.querySelectorAll('select.transport').forEach(el=>{const span=doc.createElement('span');span.className=el.className;span.textContent=el.value;el.replaceWith(span)});
 doc.querySelectorAll('.photo-hit img').forEach(im=>{const div=doc.createElement('div');div.style.cssText='width:100%;height:100%;background-size:cover;background-repeat:no-repeat;background-position:'+im.style.objectPosition;div.style.backgroundImage='url("'+im.src+'")';im.replaceWith(div)});
 doc.querySelectorAll('.field').forEach(el=>{const div=doc.createElement('div');div.className=el.className;div.style.cssText=el.style.cssText;div.textContent=el.value;div.style.whiteSpace='pre-wrap';div.style.wordBreak='break-word';el.replaceWith(div)});
 }});
 const out=document.createElement('canvas');out.width=width;out.height=Math.round(width*bounds.height/bounds.width);out.getContext('2d').drawImage(canvas,0,0,width,out.height);canvas.width=canvas.height=0;return out;
}
function downloadBlob(blob,name){TabirouteSave.open(blob,name)}
async function withExport(fn){
 if(exportBusy)return;exportBusy=true;document.activeElement?.blur();$('pages').inert=true;const buttons=[...document.querySelectorAll('.toolbar button')].map(el=>[el,el.disabled]);buttons.forEach(([el])=>el.disabled=true);
 try{await fn()}catch(e){status('保存できませんでした。再度お試しください。写真が多い場合はページごとのPNG保存も利用できます。');console.error(e)}finally{exportBusy=false;$('pages').inert=false;buttons.forEach(([el,v])=>el.disabled=v)}
}
async function exportPNG(index){const pg=document.querySelectorAll('.page')[index];if(!pg)return;await withExport(async()=>{
 status('投稿用PNGを作成しています…');const canvas=await capturePage(pg,1080);const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));if(!blob)throw Error('PNG');downloadBlob(blob,SLUG+'-'+String(index+1).padStart(2,'0')+'.png');status('PNGの準備ができました。保存方法を選んでください。');canvas.width=canvas.height=0;
})}
async function exportPDF(){await withExport(async()=>{
 const pages=[...document.querySelectorAll('.page')],pdf=new jspdf.jsPDF({unit:'mm',format:[140,140*pages[0].getBoundingClientRect().height/pages[0].getBoundingClientRect().width],compress:true});
 pdf.setProperties({title:PREF+' 旅のしおり',creator:'たびルート'});
 for(let i=0;i<pages.length;i++){
 status('しおりだけのPDFを作成中… '+(i+1)+' / '+pages.length+'ページ');
 const canvas=await capturePage(pages[i],matchMedia('(max-width:600px)').matches?1080:1440),height=140*canvas.height/canvas.width;if(i)pdf.addPage([140,height],'portrait');
 pdf.addImage(canvas.toDataURL('image/jpeg',.94),'JPEG',0,0,140,height,undefined,'FAST');canvas.width=canvas.height=0;
 await new Promise(r=>requestAnimationFrame(r));
 }
 downloadBlob(pdf.output('blob'),SLUG+'-travel-journal.pdf');status('PDFの準備ができました。保存方法を選んでください。');
})}

function importPlan(payload){if(!payload||payload.pref!==PREF||!Array.isArray(payload.days))return;const pages=[];for(const [di,d]of payload.days.slice(0,30).entries()){const rows=Array.isArray(d.rows)?d.rows:[];for(let i=0;i<Math.max(1,rows.length);i+=4){const stops=rows.slice(i,i+4).map(r=>({...blankStop(),time:String(r.t||'').slice(0,12),place:String(r.name||'').slice(0,36),transport:r.meal?'食事':r.kind==='hotel'?'宿泊':d.mode==='car'?'車':d.mode==='walk'?'徒歩':'電車・バス'}));while(stops.length<4)stops.push(blankStop());pages.push({dayIndex:di,isLastDay:di===payload.days.length-1,hasOvernight:!!d.hasOvernight,title:(di+1)+'日目のスケジュール',subtitle:String(d.date||'').slice(0,50),stops})}}data.schedule=pages.slice(0,30);if(!data.schedule.length)data.schedule=defaults().schedule;data.date=String(payload.date||'').slice(0,40);render();changed()}
window.addEventListener('message',async e=>{if(e.source!==parent||e.origin!==location.origin||e.data?.type!=='tabiroute:journal:init')return;await ready;if(!e.data.payload)return;if(!e.data.force&&(restored||revision>0)){syncDayMetadata(e.data.payload);render();changed();status('保存済みのしおりを開きました。');return}if(e.data.force){data.photos=Object.fromEntries(Object.entries(data.photos).filter(([k])=>!/^s\d+-\d+$/.test(k)))}importPlan(e.data.payload)});
let restored=false;const ready=(async()=>{data=Object.keys(seed).length?seed:defaults();try{db=await openDB();const saved=await new Promise((resolve,reject)=>{const r=db.transaction('journals').objectStore('journals').get(key);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});if(saved){data=saved;restored=true}status('文字や写真を選んで、自分だけのしおりに。')}catch(e){status('自動保存が使えない環境です。HTMLを保存して保管してください。')}render();if(parent!==window)parent.postMessage({type:'tabiroute:journal:ready'},location.origin)})();
</script></body></html>
