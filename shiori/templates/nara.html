const seed=JSON.parse(document.getElementById('seed').textContent);
const params=new URLSearchParams(location.search);const project=params.get('project')||seed.documentId||'personal';
const key='shiori-v1:'+SLUG+':'+project;
let data,db,saveTimer,activePhoto,draftPhoto,photoEpoch=0,revision=0;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const blankStop=()=>({time:'',place:'',note:'',transport:'徒歩',caption:''});
function defaults(){return {design:'watercolor',documentId:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title:PREF,subtitle:'歴史と自然、そしておいしいものに出会う旅',date:'',coverCaption:'',message:'好きな景色を、心のポケットに。',memoryTitle:'思い出のフォト',memorySubtitle:'この旅で出会った、最高の瞬間たち。',end:'See you on the next trip.',schedule:[{title:PREF.replace(/[都府県]$/,'')+'の旅スケジュール',subtitle:'',stops:Array.from({length:4},blankStop)}],captions:Array(6).fill(''),photos:{}}}
function field(path,val,placeholder='',cls='',max=60,rows=1){return `<textarea class="field ${cls}" data-path="${path}" aria-label="${esc(placeholder||path)}" placeholder="${esc(placeholder)}" maxlength="${max}" rows="${rows}" spellcheck="false">${esc(val)}</textarea>`}
function photo(id,captionPath,caption,cover=false){const p=Object.hasOwn(data.photos,id)?data.photos[id]:(cover?{src:ART,x:50,y:10}:null);const n=id==='cover'?'01':String(+(id.match(/\d+$/)?.[0]||0)+1).padStart(2,'0');return `<div class="photo"><button type="button" class="photo-hit" data-photo="${id}" aria-label="${cover?'表紙':id}の写真を選択">${p?`<img src="${p.src}" alt="${esc(caption||'旅の写真')}" style="object-position:${p.x}% ${p.y}%">`:''}<span class="empty"><b>${n}</b><span>YOUR PHOTO HERE</span></span></button>${field(captionPath,caption,'写真にひとこと','caption',24,1)}</div>`}
function controls(index,remove){return `<div class="page-controls"><button data-png="${index}">PNG保存 ↗</button>${remove===undefined?'':`<button data-remove="${remove}">／ ページ削除</button>`}</div>`}
function render(){
document.body.classList.toggle('classic',data.design!=='editorial');$('designToggle').textContent=data.design==='editorial'?'水彩ジャーナルに切替':'ポストカード風に切替';
let h=`<section class="page cover"><img class="scenery" src="${SCENERY}" alt=""><span class="classic-motto">Good Travel<br>Good Days!</span><svg class="classic-mark" viewBox="0 0 180 80" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 70 65 22 83 10 106 32 169 72M40 54 80 15 64 51M85 16 98 38 92 35 116 64M47 45 58 39 50 54M100 35 120 47 126 47 154 66"/></svg><span class="classic-label">TRAVEL JOURNAL</span><div class="edition"><span>TABIROUTE / TRAVEL JOURNAL</span><span>NO. ${EDITION}</span></div><div class="roman">${data.design==='editorial'?ROMAN.charAt(0)+ROMAN.slice(1).toLowerCase()+'.':ROMAN}</div><div class="cover-photo">${photo('cover','coverCaption',data.coverCaption,true)}</div><span class="vertical">A LITTLE ESCAPE, A LOVELY MEMORY.</span><div class="stamp"><small>JAPAN / ${ROMAN}</small><b>${EDITION}</b><small>TRAVEL NOTES</small></div>${field('title',data.title,'旅のタイトル','cover-title',16,1)}${field('date',data.date,'YYYY.MM.DD — MM.DD','date',30,1)}${field('message',data.message,'心に残したい、旅のひとこと。','cover-message',35,2)}<span class="sign">Bon voyage!</span>${controls(0)}</section>`;
data.schedule.forEach((pg,j)=>{h+=`<section class="page itinerary"><img class="scenery" src="${SCENERY}" alt=""><span class="top-label">CHAPTER ${String(j+1).padStart(2,'0')} / ${ROMAN}</span><div class="display-title">The itinerary.</div>${field(`schedule.${j}.title`,pg.title,'旅のスケジュール','page-title',24,1)}${field(`schedule.${j}.subtitle`,pg.subtitle,'日付や旅のテーマを入力','subtitle',50,2)}<div class="route">`;
pg.stops.forEach((st,i)=>{const p=`schedule.${j}.stops.${i}`;h+=`<article class="stop"><span class="num">${String(i+1).padStart(2,'0')}</span>${photo(`s${j}-${i}`,p+'.caption',st.caption)}<div class="stop-copy"><div class="stop-head">${field(p+'.time',st.time,'09:00','time',8,1)}<select class="transport" data-path="${p}.transport" aria-label="移動手段">${['徒歩','電車・バス','電車','バス','車','飛行機','船','自転車','食事','宿泊'].map(x=>`<option${x===st.transport?' selected':''}>${x}</option>`).join('')}</select></div>${field(p+'.place',st.place,'訪れたい場所','place',32,2)}${field(p+'.note',st.note,'楽しみなこと、残したいメモ。','note',60,2)}</div></article>`});h+=`</div><div class="page-bottom"><span>TAKE THE SCENIC ROUTE.</span><span>${EDITION} / ${String(j+2).padStart(2,'0')}</span></div>${controls(j+1,j)}</section>`});
h+=`<section class="page album"><img class="scenery" src="${SCENERY}" alt=""><span class="top-label">COLLECT MOMENTS, NOT THINGS.</span><div class="display-title">Little memories.</div>${field('memoryTitle',data.memoryTitle,'思い出のフォト','page-title',24,1)}${field('memorySubtitle',data.memorySubtitle,'この旅で見つけた、小さなしあわせ。','subtitle',50,2)}<div class="memories">${data.captions.map((c,i)=>photo('m'+i,'captions.'+i,c)).join('')}</div>${field('end',data.end,'See you on the next trip.','album-end',35,1)}<span class="star">✳</span>${controls(data.schedule.length+1)}</section>`;$('pages').innerHTML=h;requestAnimationFrame(fitFields);document.fonts.ready.then(fitFields);
}
function reportHeight(){if(parent!==window&&document.getElementById('pages'))parent.postMessage({type:'tabiroute:journal:resize',height:Math.ceil(document.getElementById('pages').getBoundingClientRect().bottom+scrollY+15)},location.origin)}
function fitFields(){document.querySelectorAll('.field').forEach(el=>{el.style.fontSize='';const initial=parseFloat(getComputedStyle(el).fontSize);let size=initial;while((el.scrollHeight>el.clientHeight+1||el.scrollWidth>el.clientWidth+1)&&size>initial*.62){size-=.25;el.style.fontSize=size+'px'}});reportHeight()}
window.addEventListener('resize',()=>requestAnimationFrame(fitFields));
function status(s){$('status').textContent=s}
async function openDB(){return await new Promise((resolve,reject)=>{const r=indexedDB.open('tabiroute-editable-journal',1);r.onupgradeneeded=()=>r.result.createObjectStore('journals');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function save(){clearTimeout(saveTimer);if(!db){status('自動保存を利用できません。「編集できるHTMLを保存」で保管してください。');return}try{await new Promise((resolve,reject)=>{const t=db.transaction('journals','readwrite');t.objectStore('journals').put(data,key);t.oncomplete=resolve;t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error)});status('このブラウザに保存しました。別の端末に移す場合はHTMLを保存してください。')}catch(e){status('自動保存できませんでした。HTMLを保存してください。')}}
function changed(){revision++;status('保存中…');clearTimeout(saveTimer);save()}
$('pages').addEventListener('input',e=>{const p=e.target.dataset.path;if(!p)return;const a=p.split('.');let o=data;for(const k of a.slice(0,-1))o=o[k];o[a.at(-1)]=e.target.value;fitFields();changed()});
$('pages').addEventListener('click',e=>{const b=e.target.closest('[data-photo],[data-remove],[data-png]');if(!b)return;if(b.dataset.png!==undefined){exportPNG(+b.dataset.png);return}if(b.dataset.remove!==undefined){if(data.schedule.length===1){status('旅程ページは最低1ページ必要です。');return}if(!confirm('このページの予定と写真を削除しますか？'))return;const n=+b.dataset.remove;data.schedule.splice(n,1);const photos={};for(const [k,v]of Object.entries(data.photos)){const m=/^s(\d+)-(\d+)$/.exec(k);if(!m)photos[k]=v;else if(+m[1]!==n)photos['s'+(+m[1]>n?+m[1]-1:+m[1])+'-'+m[2]]=v}data.photos=photos;render();changed();return}activePhoto=b.dataset.photo;photoEpoch++;draftPhoto=Object.hasOwn(data.photos,activePhoto)?(data.photos[activePhoto]?{...data.photos[activePhoto]}:null):(activePhoto==='cover'?{src:ART,x:50,y:10}:null);$('file').value='';$('posX').value=draftPhoto?.x??50;$('posY').value=draftPhoto?.y??50;preview();$('photoDialog').showModal()});
function preview(){$('cropPreview').src=draftPhoto?.src||'';$('cropPreview').classList.toggle('hidden',!draftPhoto);$('cropPreview').style.objectPosition=$('posX').value+'% '+$('posY').value+'%'}
for(const id of ['posX','posY'])$(id).oninput=()=>{if(draftPhoto){draftPhoto.x=+$('posX').value;draftPhoto.y=+$('posY').value}preview()};
$('file').onchange=async()=>{const f=$('file').files[0],epoch=++photoEpoch;if(!f)return;if(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>20*1024*1024){alert('20MB以下のJPEG・PNG・WebPを選んでください。');return}try{const url=URL.createObjectURL(f),im=new Image();try{im.src=url;await im.decode();const ratio=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*ratio);c.height=Math.round(im.height*ratio);const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(im,0,0,c.width,c.height);if(epoch!==photoEpoch)return;draftPhoto={src:c.toDataURL('image/jpeg',.88),x:50,y:50};$('posX').value=50;$('posY').value=50;preview()}finally{URL.revokeObjectURL(url)}}catch(e){alert('写真を読み込めませんでした。別の画像を選んでください。')}};
$('photoDone').onclick=()=>{photoEpoch++;data.photos[activePhoto]=draftPhoto;render();changed();$('photoDialog').close()};$('photoDelete').onclick=()=>{photoEpoch++;data.photos[activePhoto]=null;render();changed();$('photoDialog').close()};$('photoCancel').onclick=()=>{photoEpoch++;$('photoDialog').close()};$('photoDialog').addEventListener('cancel',()=>photoEpoch++);
$('refreshPlan').hidden=parent===window;$('refreshPlan').onclick=()=>{if(confirm('最新の予定表を反映します。旅程ページの手編集と写真は置き換わります。表紙・思い出ページは残ります。続けますか？'))parent.postMessage({type:'tabiroute:journal:request-plan'},location.origin)};
$('designToggle').onclick=()=>{data.design=data.design==='editorial'?'watercolor':'editorial';render();changed()};
$('viewSize').onclick=()=>{document.body.classList.toggle('large');$('viewSize').textContent=document.body.classList.contains('large')?'一覧に戻る':'大きく編集';requestAnimationFrame(fitFields)};
$('add').onclick=()=>{if(data.schedule.length>=30){status('旅程は最大30ページです。');return}data.schedule.push({title:'旅のスケジュール',subtitle:'',stops:Array.from({length:4},blankStop)});render();changed()};$('print').onclick=()=>window.print();

async function inlineJournalAssets(copy){
  const asData=async(url)=>{const res=await fetch(url);if(!res.ok)throw Error('Asset '+res.status);const blob=await res.blob();return await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(reader.error);reader.readAsDataURL(blob)})};
  for(const link of copy.querySelectorAll('link[data-embed]')){
    const url=new URL(link.getAttribute('href'),document.baseURI),res=await fetch(url);if(!res.ok)throw Error('Font CSS');let css=await res.text();
    const matches=[...css.matchAll(/url\(([^)]+)\)/g)];
    for(const match of matches){const ref=match[1].replace(/["']/g,'');if(!ref.startsWith('data:'))css=css.replace(match[0],'url('+await asData(new URL(ref,url))+')')}
    const style=document.createElement('style');style.textContent=css;link.replaceWith(style);
  }
  for(const script of copy.querySelectorAll('script[data-embed][src]')){
    const res=await fetch(new URL(script.getAttribute('src'),document.baseURI));if(!res.ok)throw Error('Export script');script.textContent=await res.text();script.removeAttribute('src');script.removeAttribute('data-embed');
  }
  if(!SCENERY.startsWith('data:')){
    const scenery=await asData(new URL(SCENERY,document.baseURI));
    for(const script of copy.querySelectorAll('script:not([src])'))script.textContent=script.textContent.replace('const SCENERY='+JSON.stringify(SCENERY),'const SCENERY='+JSON.stringify(scenery));
  }
}

$('backup').onclick=async()=>{$('backup').disabled=true;status('編集できるHTMLを作成しています…');try{const copy=document.documentElement.cloneNode(true);copy.querySelector('#backup').disabled=false;copy.querySelector('#seed').textContent=JSON.stringify(data).replace(/</g,'\\u003c');copy.querySelector('#pages').innerHTML='';copy.querySelector('#status').textContent='';copy.querySelector('#photoDialog').removeAttribute('open');copy.querySelector('#cropPreview').removeAttribute('src');await inlineJournalAssets(copy);const blob=new Blob(['<!doctype html>\n'+copy.outerHTML],{type:'text/html;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=SLUG+'-travel-journal.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);status('入力内容と写真を含むHTMLを保存しました。')}catch(e){status('HTML保存に必要な素材を取得できませんでした。オンラインで再度お試しください。');console.error(e)}finally{$('backup').disabled=false}};
$('reset').onclick=()=>{if(!confirm('現在のしおりを初期化しますか？ 必要なら先にHTMLを保存してください。'))return;data=defaults();render();changed()};
async function exportPNG(index){
const pg=document.querySelectorAll('.page')[index];if(!pg)return;
status('投稿用PNGを作成しています…');document.activeElement?.blur();
try{await document.fonts.ready;const canvas=await html2canvas(pg,{scale:1080/pg.getBoundingClientRect().width,backgroundColor:null,logging:false,onclone:doc=>{doc.body.classList.add('exporting');doc.querySelectorAll('select.transport').forEach(el=>{const span=doc.createElement('span');span.className=el.className;span.textContent=el.value;el.replaceWith(span)});doc.querySelectorAll('.photo-hit img').forEach(im=>{im.parentNode.querySelector('.empty').style.display='none';const div=doc.createElement('div');div.style.cssText='width:100%;height:100%;background-size:cover;background-repeat:no-repeat;background-position:'+im.style.objectPosition;div.style.backgroundImage='url("'+im.src+'")';im.replaceWith(div)});doc.querySelectorAll('.field').forEach(el=>{const div=doc.createElement('div');div.className=el.className;div.style.cssText=el.style.cssText;div.textContent=el.value;div.style.whiteSpace='pre-wrap';div.style.wordBreak='break-word';el.replaceWith(div)});}});const finalCanvas=document.createElement('canvas');finalCanvas.width=1080;finalCanvas.height=Math.round(1080*pg.getBoundingClientRect().height/pg.getBoundingClientRect().width);finalCanvas.getContext('2d').drawImage(canvas,0,0,1080,finalCanvas.height);const blob=await new Promise(r=>finalCanvas.toBlob(r,'image/png'));if(!blob)throw Error('PNG');const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=SLUG+'-'+String(index+1).padStart(2,'0')+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000);status('PNGを保存しました（1080 × '+finalCanvas.height+'px）。')}catch(e){status('画像を保存できませんでした。HTML保存または印刷をご利用ください。');console.error(e)}
}
function importPlan(payload){if(!payload||payload.pref!==PREF||!Array.isArray(payload.days))return;const pages=[];for(const [di,d]of payload.days.slice(0,30).entries()){const rows=Array.isArray(d.rows)?d.rows:[];for(let i=0;i<Math.max(1,rows.length);i+=4){const stops=rows.slice(i,i+4).map(r=>({...blankStop(),time:String(r.t||'').slice(0,12),place:String(r.name||'').slice(0,36),transport:r.meal?'食事':r.kind==='hotel'?'宿泊':d.mode==='car'?'車':d.mode==='walk'?'徒歩':'電車・バス'}));while(stops.length<4)stops.push(blankStop());pages.push({title:(di+1)+'日目のスケジュール',subtitle:String(d.date||'').slice(0,50),stops})}}data.schedule=pages.slice(0,30);if(!data.schedule.length)data.schedule=defaults().schedule;data.date=String(payload.date||'').slice(0,40);render();changed()}
window.addEventListener('message',async e=>{if(e.source!==parent||e.origin!==location.origin||e.data?.type!=='tabiroute:journal:init')return;await ready;if(!e.data.payload)return;if(!e.data.force&&(restored||revision>0)){status('保存済みのしおりを開きました。');return}if(e.data.force){data.photos=Object.fromEntries(Object.entries(data.photos).filter(([k])=>!/^s\d+-\d+$/.test(k)))}importPlan(e.data.payload)});
let restored=false;const ready=(async()=>{data=Object.keys(seed).length?seed:defaults();try{db=await openDB();const saved=await new Promise((resolve,reject)=>{const r=db.transaction('journals').objectStore('journals').get(key);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});if(saved){data=saved;restored=true}status('文字や写真を選んで、自分だけのしおりに。')}catch(e){status('自動保存が使えない環境です。HTMLを保存して保管してください。')}render();if(parent!==window)parent.postMessage({type:'tabiroute:journal:ready'},location.origin)})();
</script></body></html>
