<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><title>写真取得の確認｜たびルート</title><style>body{margin:0;background:#f3f7fc;color:#17344c;font:16px/1.8 system-ui,sans-serif}main{max-width:820px;margin:auto;padding:24px}h1{font-size:25px}label{display:block;margin:12px 0}input,button{box-sizing:border-box;font:inherit;border-radius:8px;border:1px solid #c9d9eb;padding:10px}input{width:100%}button{background:#215dab;color:white;cursor:pointer}pre{font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:15px;border-radius:10px}img{max-width:100%;max-height:360px;display:block}a{color:#205ca0}.row{display:flex;gap:12px}.row label{flex:1}#preview{background:white;border-radius:10px;padding:16px;margin-top:20px}</style></head><body><main><a href="index.html">← たびルート</a><h1>観光地写真の取得を確認</h1><p>写真方式：photo-v10。名前と位置から観光地を照合し、公開写真を取得します。確認は1件ずつ行います。</p><form id="test"><label>観光地名<input id="name" required maxlength="160" value="清水寺"></label><div class="row"><label>緯度<input id="lat" type="number" step="any" required value="34.9949"></label><label>経度<input id="lng" type="number" step="any" required value="135.785"></label></div><label>Wikipedia記事名（分かる場合）<input id="wiki" placeholder="例：ja:清水寺"></label><button>写真を確認する</button></form><pre id="result" role="status">結果がここに表示されます。</pre><div id="preview"></div><p>「写真未登録」「場所未特定」「通信障害」を別々に表示します。通信障害は写真が存在しないという意味ではありません。</p></main><script src="booking/config.js?v=10"></script><script src="booking/photo-core.js?v=10"></script><script src="booking/photo-check.js?v=10"></script></body></html>
