<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>たびルート 接続確認</title>
<style>body{font-family:system-ui,sans-serif;background:#f3f6f3;color:#233b36;margin:0;padding:24px;line-height:1.8}main{max-width:760px;margin:auto;background:white;padding:28px;border-radius:18px}button{font:inherit;padding:10px 16px;margin:6px;border:1px solid #c5d8cd;border-radius:10px;background:#eef5ef;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:16px;background:#f5f7f5;border-radius:12px;font-size:13px}p{font-size:14px}a{color:#246e53}button:disabled{opacity:.5}h1{font-size:24px}</style>
<main><h1>たびルート 接続確認</h1><p>サイト運営者向けの確認ページです。APIキーの入力は不要です。公開済みの <code>booking/config.js</code> の接続先を使います。</p><p id="base"></p><button data-path="/health">1. 接続・設定を確認</button><button data-path="/hotels?lat=34.9858&amp;lng=135.7588">2. 京都駅周辺のホテルを確認</button><button data-path="/restaurants?lat=34.9858&amp;lng=135.7588">3. 京都駅周辺の飲食店を確認</button><pre id="result" role="status">ボタンを押すと1回だけ問い合わせます。エラー時は表示された待ち時間を置いてください。</pre><p>①は設定の有無だけを確認します。キー自体が有効かどうかは②・③で確認します。エラーが出たら、表示された確認結果を控えてください。APIキー・アクセスキーを送る必要はありません。</p><a href="../index.html">たびルートに戻る</a></main>
<script src="config.js"></script><script>
const cfg=window.TABIROUTE_BOOKING||{},out=document.getElementById('result');let root='';let waitUntil=0;
try{const u=new URL(cfg.apiBase);if(u.protocol==='https:'||u.hostname==='localhost'||u.hostname==='127.0.0.1')root=u.href.replace(/\/$/,'');}catch{}
document.getElementById('base').textContent='接続先：'+(root||'未設定。booking/config.js の apiBase を確認してください。');
const messages={not_configured:'WorkerのSecretsが未設定です。RAKUTEN_APP_ID・RAKUTEN_ACCESS_KEY・HOTPEPPER_API_KEYを確認してください。',provider_config:'API側で認証または許可設定が拒否されています。キーの組み合わせ、楽天のアプリ登録と許可設定を確認してください。',provider_limited:'提供元の利用制限、または一時的なサービス停止です。待ってから確認してください。',provider_unavailable:'提供元への通信、タイムアウト、または提供元エラーです。',provider_bad_response:'提供元がJSON以外などの読み取れない応答を返しました。',origin_denied:'Workerの ALLOWED_ORIGINS に、このサイトのオリジンが登録されていません。',maintenance:'Workerの API_ENABLED が false です。',not_found:'Worker URLの末尾に余分なパスがないか、今回の worker.mjs を配置したか確認してください。'};
document.addEventListener('click',async e=>{const b=e.target.closest('[data-path]');if(!b)return;if(!root){out.textContent='接続先が未設定です。booking/config.js にWorkerのURLを入力してください。';return;}if(Date.now()<waitUntil){out.textContent='次の確認まで約'+Math.ceil((waitUntil-Date.now())/1000)+'秒お待ちください。';return;}document.querySelectorAll('button').forEach(x=>x.disabled=true);out.textContent='確認中…';try{const r=await fetch(root+b.dataset.path,{credentials:'omit',signal:AbortSignal.timeout(12000)});let j;try{j=await r.json();}catch{waitUntil=Date.now()+300000;out.textContent='HTTP '+r.status+'：JSON以外の応答です。Cloudflareの制限、接続先、Workerの配置を確認してください。5分後に再確認できます。';return;}const safe={httpStatus:r.status,ok:j.ok,code:j.code,version:j.version,configured:j.configured,enabled:j.enabled,itemCount:Array.isArray(j.items)?j.items.length:undefined,retryAfter:j.retryAfter};out.textContent=JSON.stringify(safe,null,2)+'\n\n'+(j.ok?'応答を取得できました。':messages[j.code]||'応答コードを導入手順書と照合してください。');if(!j.ok)waitUntil=Date.now()+Math.max(60,Number(j.retryAfter)||300)*1000;else waitUntil=Date.now()+1500;}catch{waitUntil=Date.now()+60000;out.textContent='通信に失敗しました。WorkerのURL、ALLOWED_ORIGINS（このサイト：'+location.origin+'）、インターネット接続を確認してください。CORSが原因の場合も同じ表示になります。1分後に再確認できます。';}finally{document.querySelectorAll('button').forEach(x=>x.disabled=false);}});
</script></html>
